[tools]
node = "20"
pnpm = "10.30.3"

[tasks.install]
description = "Install JavaScript dependencies with pnpm"
run = "pnpm install"

[tasks.setup]
description = "Seed the local database and prepare the project"
depends = ["install"]
run = "pnpm setup"

[tasks.dev]
description = "Start the Nuxt development server"
run = "pnpm dev"

[tasks.build]
description = "Build the production bundle"
run = "pnpm build"

[tasks.lint]
description = "Run ESLint across the project"
run = "pnpm lint"
